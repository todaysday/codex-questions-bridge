[codex]
# Control socket of the shared Codex app-server daemon (usually root-only).
socket = "/root/.codex/app-server-control/app-server-control.sock"
source_id = "local"            # namespace for everything stored from this daemon
poll_interval_seconds = 30     # 5..3600
recency_days = 30              # inventory ignores threads not updated within this window
codex_home = "/root/.codex"    # status card reads token_count from rollouts under sessions/ and archived_sessions/

[db]
path = "/var/lib/cqb/cqb.db"

[telegram]
# Private forum supergroup (numeric id, starts with -100). The bot token is NOT here:
# it is read from the environment variable CQB_TELEGRAM_TOKEN.
chat_id = -1001234567890
allowed_user_ids = [123456789]            # only these users may press buttons or write
control_topic_name = "📋 Треды Codex"
registry_refresh_seconds = 5              # 5..3600; at most one edit of the pinned registry message per this many seconds, only if it changed

# Consultant chat (PicoClaw). Present = consultants are enabled and the process refuses to start without
# CQB_PICO_TOKEN and CQB_MCP_TOKEN in its environment (two different secrets, never in this file).
# Remove both sections to run the bot without consultants: consultant topics then say the chat is not configured.
[pico]
url = "ws://127.0.0.1:18790/pico/ws"   # loopback only
session_prefix = "cqb-"                # must match the stored consultant session keys; do not change
idle_seconds = 120                     # 10..3600: an idle consultant's WebSocket is closed after this long
max_connections = 50                   # 1..90, hard cap below PicoClaw's own limit of 100
turn_timeout_seconds = 0               # 0 = no reply time limit (default); the owner stops a turn with /stop

[mcp]
port = 18791                           # 1024..65535; always bound to 127.0.0.1
# Read-only project files for the consultant (tools read_project_file and list_project_dir). OFF by default:
# while false the tools are not listed and calls are refused with `disabled`. The root is the working directory
# of the consultant's root thread (broad ones such as /, /root, /home, /etc, /var, /usr, /opt, /srv are refused);
# symlinks are never followed; names such as .git, .env*, keys, *secret*, *token*, *credential*, databases,
# node_modules, .venv are denied and hidden; everything returned is redacted. Never logs paths or contents.
project_files = false
project_file_max_bytes = 16384         # 1024..65536: output cap of one read or listing
project_dir_max_entries = 200          # 1..1000
project_file_deny_extra = []           # extra name patterns (fnmatch, case-insensitive) added to the built-in deny table

# The /status snapshot (consultant topics only). Works without [pico] too: the card then says `резюме недоступно`.
[status]
timeout_seconds = 300                  # 30..3600: the whole collect, Status Agent summary included; after this the card goes out without it
slots = 2                              # 1..8: Status Agent sessions cqb-status-1..N; every slot needs a dispatch rule in PicoClaw's config.json (+ /reload)

# Questions an agent puts into a message ("Question / Answer question" cards of the Codex apps). They do not block
# the turn, so the Bridge finds them by reading thread items (no resume, no subscribe) and answers them by sending
# a normal user message into the thread. Blocking request_user_input questions need no setting.
[questions]
agent_scan_seconds = 20                # 5..600: period of the sweep over working and recently updated root threads
